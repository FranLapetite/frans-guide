<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Redirect all 404s to index.html, preserving the path AND the query
      // string (needed for utm_* campaign tracking) plus any hash.
      var l = window.location;
      var redirectTo =
        l.protocol + '//' + l.host +
        '/?p=' + encodeURIComponent(l.pathname) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;
      l.replace(redirectTo);
    </script>
  </head>
  <body>
  </body>
</html>
